<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AI 음성 미리 듣기</title>
<link rel="stylesheet" href="style.css">
<style>
  .wrap { max-width: 560px; margin: 0 auto; padding: calc(14px + env(safe-area-inset-top)) 16px 40px; }
  .vs { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .vs button { border: 1.5px solid var(--line); background: var(--surface); border-radius: 99px; padding: 9px 4px; font-weight: 700; font-size: 14px; }
  .vs button.on { border-color: var(--accent); background: var(--accent-soft); color: var(--accent); }
  .it { display: flex; align-items: center; gap: 10px; padding: 10px 12px; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; }
  .it .t { flex: 1; min-width: 0; }
  .it .t b { font-family: var(--zh); font-size: 19px; font-weight: 600; display: block; }
  .it .t span { font-size: 13px; color: var(--muted); }
  .it button { border: 0; border-radius: 99px; padding: 8px 12px; font-size: 13px; font-weight: 700; background: var(--accent); color: #fff; flex: none; }
  .it button.dev { background: var(--surface-2); color: var(--text); }
  .list { display: grid; gap: 8px; }
  h2 { font-size: 15px; margin: 18px 0 8px; }
</style>
</head>
<body>
<div class="wrap stack">
  <a href="./" class="small" style="color:var(--accent)">← 앱으로 돌아가기</a>
  <h1 style="font-size:20px;margin:4px 0 0">AI 음성 미리 듣기 (테스트)</h1>
  <p class="small muted" style="margin:0">오픈소스 Kokoro 음성(Apache 2.0)으로 미리 만든 소리예요. 목소리를 고르고 ▶ AI를 눌러 들어 보세요. ‘기기’ 버튼은 지금 앱이 쓰는 휴대폰 음성이에요. 특히 <b>银行·一行·行</b>, <b>长城·长大·长</b>처럼 읽는 법이 두 가지인 글자가 맞게 읽히는지 확인해 주세요.</p>
  <h2>여성 목소리</h2>
  <div class="vs" id="vf"></div>
  <h2>남성 목소리</h2>
  <div class="vs" id="vm"></div>
  <h2>단어 · 한자 · 예문</h2>
  <div class="list" id="list"></div>
</div>
<script>
(function () {
  var VOICES = { f: [["3", "여성 A"], ["20", "여성 B"], ["45", "여성 C"]], m: [["58", "남성 A"], ["60", "남성 B"], ["62", "남성 C"]] };
  var ITEMS = [
    ["你好", "nǐ hǎo · 안녕하세요"], ["学习", "xuéxí · 공부하다"], ["银行", "yínháng · 은행 (行=háng)"], ["觉得", "juéde · ~라고 느끼다"],
    ["重要", "zhòngyào · 중요하다"], ["便宜", "piányi · 싸다"], ["还是", "háishi · 아니면"], ["长城", "Chángchéng · 만리장성 (长=cháng)"],
    ["长大", "zhǎngdà · 자라다 (长=zhǎng)"], ["睡觉", "shuìjiào · 자다 (觉=jiào)"], ["一行", "yì xíng / yì háng · 일행·한 줄"], ["不客气", "bú kèqi · 천만에요"],
    ["行", "xíng / háng · 한자 하나"], ["长", "cháng / zhǎng · 한자 하나"], ["好", "hǎo · 한자 하나"],
    ["我每天学习汉语。", "Wǒ měi tiān xuéxí Hànyǔ."], ["我去银行取钱。", "Wǒ qù yínháng qǔ qián."], ["我觉得汉语不难。", "Wǒ juéde Hànyǔ bù nán."],
    ["这件事很重要。", "Zhè jiàn shì hěn zhòngyào."], ["这件衣服很便宜。", "Zhè jiàn yīfu hěn piányi."], ["你喝茶还是喝咖啡？", "Nǐ hē chá háishi hē kāfēi?"]
  ];
  var cur = "3", audio = new Audio();
  function voices() {
    ["f", "m"].forEach(function (g) {
      document.getElementById("v" + g).innerHTML = VOICES[g].map(function (v) {
        return '<button data-sid="' + v[0] + '"' + (v[0] === cur ? ' class="on"' : '') + '>' + v[1] + '</button>';
      }).join("");
    });
    document.querySelectorAll(".vs button").forEach(function (b) {
      b.onclick = function () { cur = b.dataset.sid; voices(); play(16); };
    });
  }
  function play(i) { audio.pause(); audio.src = "audio-sample/" + cur + "/" + i + ".m4a"; audio.play(); }
  function dev(t) {
    if (!("speechSynthesis" in window)) return;
    speechSynthesis.cancel(); var u = new SpeechSynthesisUtterance(t); u.lang = "zh-CN"; u.rate = 0.85; speechSynthesis.speak(u);
  }
  document.getElementById("list").innerHTML = ITEMS.map(function (x, i) {
    return '<div class="it"><div class="t"><b>' + x[0] + '</b><span>' + x[1] + '</span></div>' +
      '<button data-i="' + (i + 1) + '">▶ AI</button><button class="dev" data-d="' + i + '">기기</button></div>';
  }).join("");
  document.querySelectorAll("[data-i]").forEach(function (b) { b.onclick = function () { play(b.dataset.i); }; });
  document.querySelectorAll("[data-d]").forEach(function (b) { b.onclick = function () { dev(ITEMS[+b.dataset.d][0]); }; });
  try { var th = JSON.parse(localStorage.getItem("hsk-hanzi-v1") || "{}").set; if (th && th.theme !== "auto") document.documentElement.setAttribute("data-theme", th.theme); } catch (e) {}
  voices();
})();
</script>
</body>
</html>
